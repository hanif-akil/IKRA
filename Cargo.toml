[package]
name = "ikra-pdf-editor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ikra"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", features = ["default_fonts", "wgpu"] }
egui = "0.29"
pdfium-render = { version = "0.8", features = ["image", "thread_safe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.32"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
debug = true