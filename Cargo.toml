[package]
name = "ikra-pdf-editor"
version = "2.0.0"
edition = "2024"
authors = ["Your Name <you@example.com>"]
description = "Professional PDF Editor built with Rust"
license = "MIT"

[[bin]]
name = "ikra"
path = "src/main.rs"

# ... (Keep your dependencies here) ...

[package.metadata.deb]
maintainer = "Your Name <you@example.com>"
assets = [
    ["target/release/ikra", "usr/bin/ikra", "755"],
    ["assets/ikra.png", "usr/share/pixmaps/ikra.png", "644"]
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/ikra", dest = "/usr/bin/ikra", mode = "755" },
    { source = "assets/ikra.png", dest = "/usr/share/pixmaps/ikra.png", mode = "644" }
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true # Automatically strips the binary, making manual `strip` steps redundant