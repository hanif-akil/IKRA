name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build – ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: clocky-windows-installer.exe

          - os: ubuntu-latest
            archive: clocky-linux-installer.deb

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libglib2.0-dev \
            libcanberra-gtk3-module

      # ── Download pdfium (Windows) ──────────────
      - name: Download pdfium (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          curl -L "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz" -o pdfium.tgz
          mkdir pdfium
          tar -xzf pdfium.tgz -C pdfium
          # copy the dll next to where the binary will be built
          cp pdfium/bin/pdfium.dll .

      # ── Download pdfium (Linux) ────────────────
      - name: Download pdfium (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -L "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz" -o pdfium.tgz
          mkdir pdfium
          tar -xzf pdfium.tgz -C pdfium
          cp pdfium/lib/libpdfium.so .

      - name: Build release
        run: cargo build --release

      # ════════════════════════════════════════════
      # WINDOWS — Inno Setup installer
      # ════════════════════════════════════════════
      - name: Create Inno Setup script
        if: matrix.os == 'windows-latest'
        run: |
          cat > installer.iss << 'EOF'
          [Setup]
          AppName=Clocky
          AppVersion=1.0
          DefaultDirName={autopf}\Clocky
          DefaultGroupName=Clocky
          OutputBaseFilename=clocky-windows-installer
          Compression=lzma
          SolidCompression=yes
          
          [Files]
          Source: "target\release\clocky.exe"; DestDir: "{app}"
          Source: "pdfium.dll";                DestDir: "{app}"
          
          [Icons]
          Name: "{group}\Clocky";        Filename: "{app}\clocky.exe"
          Name: "{commondesktop}\Clocky"; Filename: "{app}\clocky.exe"
          
          [Run]
          Filename: "{app}\clocky.exe"; Description: "Launch Clocky"; Flags: postinstall nowait
          EOF
        shell: bash

      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        run: |
          choco install innosetup -y
          iscc installer.iss
          mv Output/clocky-windows-installer.exe clocky-windows-installer.exe

      # ════════════════════════════════════════════
      # LINUX — .deb package
      # ════════════════════════════════════════════
      - name: Install cargo-deb
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cargo-deb --locked

      - name: Prepare pdfium for deb bundle
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p pkg/usr/lib
          cp libpdfium.so pkg/usr/lib/libpdfium.so

      - name: Add deb metadata to Cargo.toml
        if: matrix.os == 'ubuntu-latest'
        run: |
          cat >> Cargo.toml << 'EOF'

          [package.metadata.deb]
          maintainer = "hanif-akil"
          description = "A polished desktop clock"
          section = "utils"
          priority = "optional"
          assets = [
            ["target/release/clocky",    "usr/bin/clocky",           "755"],
            ["libpdfium.so",             "usr/lib/libpdfium.so",     "644"],
          ]
          EOF

      - name: Build DEB
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo deb
          mv target/debian/*.deb clocky-linux-installer.deb

      # ════════════════════════════════════════════
      # Upload both installers to the release
      # ════════════════════════════════════════════
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
