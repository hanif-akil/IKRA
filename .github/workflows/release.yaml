name: Release Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Dynamically Patch Cargo.toml for Package Tools
        run: |
          cat << 'EOF' >> Cargo.toml

          [package.metadata.deb]
          maintainer = "Maintainer <support@example.com>"
          assets = [
              ["target/release/ikra", "usr/bin/ikra", "755"],
              ["assets/ikra.png", "usr/share/pixmaps/ikra.png", "644"]
          ]

          [package.metadata.generate-rpm]
          assets = [
              { source = "target/release/ikra", dest = "/usr/bin/ikra", mode = "755" },
              { source = "assets/ikra.png", dest = "/usr/share/pixmaps/ikra.png", mode = "644" }
          ]
          EOF
          
          sed -i '/\[package\]/a description = "Professional PDF Editor"\nlicense = "MIT"' Cargo.toml

      - name: Build Release Binary
        run: cargo build --release

      - name: Fetch Pre-compiled Packaging Tools (Fast)
        run: |
          mkdir -p temp_bin ~/.cargo/bin
          
          # Fetch and safely extract cargo-deb binary avoiding folder path structural shifts
          curl -L https://github.com/kornelski/cargo-deb/releases/download/v2.10.0/cargo-deb_2.10.0_amd64.tar.xz | tar xJ -C temp_bin
          find temp_bin -type f -name "cargo-deb" -exec mv {} ~/.cargo/bin/ \;
          
          # Fetch and safely extract cargo-generate-rpm binary
          curl -L https://github.com/cat-in-136/cargo-generate-rpm/releases/download/v0.15.1/cargo-generate-rpm-v0.15.1-x86_64-unknown-linux-musl.tar.gz | tar xz -C temp_bin
          find temp_bin -type f -name "cargo-generate-rpm" -exec mv {} ~/.cargo/bin/ \;

      - name: Build Debian Package (.deb)
        run: ~/.cargo/bin/cargo deb

      - name: Build Fedora Package (.rpm)
        run: ~/.cargo/bin/cargo generate-rpm

      - name: Build Arch Linux Package (.pkg.tar.zst)
        run: |
          # Isolate the compilation execution script to protect environment tokens and directory string mapping
          cat << 'EOF' > build_arch.sh
          #!/bin/bash
          set -e
          pacman -Syu --noconfirm base-devel sudo
          useradd builduser -m && passwd -d builduser
          printf 'builduser ALL=(ALL) ALL\n' >> /etc/sudoers

          cat << 'PKGEof' > PKGBUILD
          pkgname=ikra-pdf-editor
          pkgver=${CLEAN_VERSION}
          pkgrel=1
          pkgdesc='Professional PDF Editor'
          arch=('x86_64')
          license=('MIT')
          depends=('libxcb' 'libxkbcommon' 'openssl' 'gtk3')
          package() {
            install -Dm755 target/release/ikra "${pkgdir}/usr/bin/ikra"
            if [ -f "assets/ikra.png" ]; then
              install -Dm644 assets/ikra.png "${pkgdir}/usr/share/pixmaps/ikra.png"
            fi
            mkdir -p "${pkgdir}/usr/share/applications"
            cat << DESK > "${pkgdir}/usr/share/applications/ikra.desktop"
          [Desktop Entry]
          Name=IKRA
          Exec=ikra
          Icon=ikra
          Type=Application
          Categories=Office;
          DESK
          }
          PKGEof

          chown -R builduser:builduser .
          sudo -u builduser makepkg -s --noconfirm
          EOF

          chmod +x build_arch.sh
          CLEAN_VER="${GITHUB_REF_NAME#v}"

          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e CLEAN_VERSION="$CLEAN_VER" \
            archlinux:latest bash build_arch.sh
          
          cp *.pkg.tar.zst target/ 2>/dev/null || true

      - name: Upload Linux Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            target/*.pkg.tar.zst

  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Release Binary
        run: cargo build --release

      - name: Generate Inno Setup Deployment Script
        run: |
          # Dynamically verify if an icon exists before passing parameters to Inno Setup
          $hasIcon = Test-Path "assets\ikra.ico"
          $SetupIconLine = if ($hasIcon) { "SetupIconFile=assets\ikra.ico" } else { "" }
          $IconLine1 = if ($hasIcon) { "Name: `"{group}\IKRA`"; Filename: `"{app}\ikra.exe`"; IconFilename: `"{app}\ikra.ico`"" } else { "Name: `"{group}\IKRA`"; Filename: `"{app}\ikra.exe`"" }
          $IconLine2 = if ($hasIcon) { "Name: `"{autodesktop}\IKRA`"; Filename: `"{app}\ikra.exe`"; IconFilename: `"{app}\ikra.ico`"" } else { "Name: `"{autodesktop}\IKRA`"; Filename: `"{app}\ikra.exe`"" }
          $FileIconLine = if ($hasIcon) { "Source: `"assets\ikra.ico`"; DestDir: `"{app}`"; Flags: ignoreversion" } else { "" }

          $IssContent = @"
          [Setup]
          AppName=IKRA
          AppVersion=${{ github.ref_name }}
          DefaultDirName={autopf}\IKRA
          DefaultGroupName=IKRA
          OutputBaseFilename=IKRA_Installer
          Compression=lzma
          SolidCompression=yes
          $SetupIconLine

          [Files]
          Source: "target\release\ikra.exe"; DestDir: "{app}"; Flags: ignoreversion
          $FileIconLine

          [Icons]
          $IconLine1
          $IconLine2
          "@
          Set-Content -Path installer.iss -Value $IssContent
        shell: powershell

      - name: Compile Windows Executable Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer.iss

      - name: Upload Windows Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Output/IKRA_Installer.exe

  publish-github-release:
    runs-on: ubuntu-latest
    needs: [build-linux-packages, build-windows-installer]
    steps:
      - name: Fetch Linux Bundles
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: ./dist

      - name: Fetch Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./dist

      - name: Generate Official GitHub Release Page
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/IKRA_Installer.exe
          body: "Automated compiler pipeline distribution for version ${{ github.ref_name }}."
