name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Build Release Binary
        run: cargo build --release

      - name: Install Packaging Tools (Fast Pre-compiled Binaries)
        run: |
          # Fetch pre-compiled binary releases instead of compiling from source
          curl -L https://github.com/kornelski/cargo-deb/releases/download/v2.10.0/cargo-deb_2.10.0_amd64.tar.xz | tar xJ -C ~/.cargo/bin/
          curl -L https://github.com/cat-in-136/cargo-generate-rpm/releases/download/v0.15.1/cargo-generate-rpm-v0.15.1-x86_64-unknown-linux-musl.tar.gz | tar xz -C ~/.cargo/bin/

      - name: Build DEB Package
        run: cargo deb

      - name: Build RPM Package
        run: cargo generate-rpm

      - name: Build Arch Linux Package (.pkg.tar.zst)
        run: |
          # Use standard docker onto host ubuntu runner to generate native Arch tracking package
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace archlinux:latest bash -c "
            pacman -Syu --noconfirm base-devel sudo
            useradd builduser -m && passwd -d builduser
            printf 'builduser ALL=(ALL) ALL\n' >> /etc/sudoers
            
            # Normalize tag version for Arch Linux requirements
            RAW_VER='${{ github.ref_name }}'
            CLEAN_VER=\${RAW_VER#v}

            sudo -u builduser bash -c \"
              cat << 'EOF' > PKGBUILD
pkgname=ikra-pdf-editor
pkgver=\${CLEAN_VER}
pkgrel=1
pkgdesc='Professional PDF Editor'
arch=('x86_64')
license=('MIT')
depends=('libxcb' 'libxkbcommon' 'openssl')
package() {
  install -Dm755 target/release/ikra \\\${pkgdir}/usr/bin/ikra
  install -Dm644 assets/ikra.png \\\${pkgdir}/usr/share/pixmaps/ikra.png
  mkdir -p \\\${pkgdir}/usr/share/applications
  cat << DESK > \\\${pkgdir}/usr/share/applications/ikra.desktop
[Desktop Entry]
Name=IKRA
Exec=ikra
Icon=ikra
Type=Application
Categories=Office;
DESK
}
EOF
              makepkg -s --noconfirm
            \"
            cp *.pkg.tar.zst target/
          "

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            target/*.pkg.tar.zst

  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Binary
        run: cargo build --release

      - name: Create Inno Setup Script
        run: |
          $IssContent = @"
          [Setup]
          AppName=IKRA
          AppVersion=${{ github.ref_name }}
          DefaultDirName={autopf}\IKRA
          DefaultGroupName=IKRA
          OutputBaseFilename=IKRA_Installer
          Compression=lzma
          SolidCompression=yes
          SetupIconFile=assets\ikra.ico

          [Files]
          Source: "target\release\ikra.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "assets\ikra.ico"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\IKRA"; Filename: "{app}\ikra.exe"; IconFilename: "{app}\ikra.ico"
          Name: "{autodesktop}\IKRA"; Filename: "{app}\ikra.exe"; IconFilename: "{app}\ikra.ico"
          "@
          Set-Content -Path installer.iss -Value $IssContent
        shell: powershell

      - name: Compile Windows Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer.iss

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Output/IKRA_Installer.exe